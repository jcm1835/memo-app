<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모장</title>
<style>
  :root {
    --bg: #ffffff; --side: #f7f6f3; --hover: #ebeae6; --active: #e3e2de;
    --text: #37352f; --muted: #9b9a97; --line: #e9e9e7; --accent: #2383e2; --danger: #eb5757;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --side: #202020; --hover: #2c2c2c; --active: #373737;
      --text: #e6e6e4; --muted: #7f7f7d; --line: #2f2f2f; --accent: #529cca; --danger: #ff7369;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .app { display: flex; height: 100dvh; }

  /* 사이드바 */
  .side {
    width: 280px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0;
  }
  .side-head { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-weight: 600; font-size: 15px; }
  .btn-new {
    display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 6px;
    font-size: 13px; color: var(--muted);
  }
  .btn-new:hover { background: var(--hover); color: var(--text); }
  .search {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .item { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; margin-bottom: 2px; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); }
  .item-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 32px 12px; }
  mark { background: rgba(255, 212, 0, .35); color: inherit; border-radius: 2px; }

  /* 편집기 */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; min-height: 48px; color: var(--muted); font-size: 12px;
  }
  .bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .back { display: none; padding: 6px 10px; border-radius: 6px; font-size: 14px; color: var(--text); }
  .back:hover { background: var(--hover); }
  .btn-del { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
  .btn-del:hover { background: var(--hover); color: var(--danger); }
  .editor { flex: 1; overflow-y: auto; width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 56px 80px; display: flex; flex-direction: column; }
  .title {
    width: 100%; border: 0; outline: none; background: transparent; color: var(--text);
    font: inherit; font-size: 38px; font-weight: 700; line-height: 1.25; padding: 0; margin-bottom: 12px;
  }
  .body {
    width: 100%; flex: 1; min-height: 50vh; border: 0; outline: none; resize: none; background: transparent;
    color: var(--text); font: inherit; font-size: 16px; line-height: 1.7; padding: 0;
  }
  .title::placeholder, .body::placeholder { color: var(--muted); opacity: .6; }
  .blank { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .blank button { margin-top: 12px; padding: 8px 16px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; }

  /* 모바일 */
  @media (max-width: 720px) {
    .side { width: 100%; border-right: 0; }
    .main { display: none; width: 100%; }
    .app.editing .side { display: none; }
    .app.editing .main { display: flex; }
    .back { display: block; }
    .editor { padding: 8px 18px 60px; }
    .title { font-size: 28px; }
    .search, .body { font-size: 16px; } /* iOS 확대 방지 */
    .item { padding: 12px 10px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><span>📝 내 메모</span><button class="btn-new" id="newBtn">＋ 새 메모</button></div>
      <input class="search" id="search" type="search" placeholder="검색" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
(() => {
  const KEY = 'memo-app-v1';
  const $ = id => document.getElementById(id);
  const app = $('app'), listEl = $('list'), mainEl = $('main'), searchEl = $('search');

  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { notes = []; }
  let currentId = null;
  let query = '';

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { alert('저장 공간이 부족합니다.'); } };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hl = (s, q) => {
    if (!q) return esc(s);
    const i = s.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return esc(s);
    return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
  };
  const fmt = t => {
    const d = new Date(t), n = new Date();
    const same = d.toDateString() === n.toDateString();
    return same ? d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' });
  };
  const get = id => notes.find(n => n.id === id);

  function snippet(n, q) {
    const body = n.body.replace(/\s+/g, ' ').trim();
    if (!q) return body || '내용 없음';
    const i = body.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return body || '내용 없음';
    const start = Math.max(0, i - 15);
    return (start > 0 ? '…' : '') + body.slice(start, start + 80);
  }

  function renderList() {
    const q = query.trim();
    const shown = notes
      .filter(n => !q || (n.title + '\n' + n.body).toLowerCase().includes(q.toLowerCase()))
      .sort((a, b) => b.updated - a.updated);
    if (!shown.length) {
      listEl.innerHTML = '<div class="empty">' + (q ? '검색 결과가 없습니다' : '메모가 없습니다') + '</div>';
      return;
    }
    listEl.innerHTML = shown.map(n =>
      '<button class="item' + (n.id === currentId ? ' active' : '') + '" data-id="' + n.id + '">' +
      '<div class="item-title">' + hl(n.title || '제목 없음', q) + '</div>' +
      '<div class="item-sub">' + fmt(n.updated) + ' · ' + hl(snippet(n, q), q) + '</div></button>'
    ).join('');
  }

  function renderMain() {
    const n = get(currentId);
    if (!n) {
      app.classList.remove('editing');
      mainEl.innerHTML = '<div class="blank"><div><div style="font-size:40px">📝</div><p>메모를 선택하거나 새로 만드세요</p><button id="blankNew">＋ 새 메모</button></div></div>';
      $('blankNew').onclick = createNote;
      return;
    }
    app.classList.add('editing');
    mainEl.innerHTML =
      '<div class="bar"><div class="bar-left"><button class="back" id="back">← 목록</button><span id="stamp"></span></div>' +
      '<button class="btn-del" id="del">🗑 삭제</button></div>' +
      '<div class="editor"><input class="title" id="title" placeholder="제목 없음" autocomplete="off">' +
      '<textarea class="body" id="body" placeholder="여기에 내용을 입력하세요…"></textarea></div>';
    const t = $('title'), b = $('body');
    t.value = n.title; b.value = n.body;
    $('stamp').textContent = '수정 ' + fmt(n.updated);
    const onInput = () => {
      n.title = t.value; n.body = b.value; n.updated = Date.now();
      save();
      $('stamp').textContent = '수정 ' + fmt(n.updated);
      renderList();
    };
    t.oninput = b.oninput = onInput;
    t.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); b.focus(); } };
    $('back').onclick = () => { currentId = null; renderAll(); };
    $('del').onclick = () => {
      if (!confirm('이 메모를 삭제할까요?')) return;
      notes = notes.filter(x => x.id !== n.id);
      save(); currentId = null; renderAll();
    };
  }

  function renderAll() { renderList(); renderMain(); }

  function createNote() {
    const n = { id: uid(), title: '', body: '', created: Date.now(), updated: Date.now() };
    notes.unshift(n); save();
    query = ''; searchEl.value = '';
    currentId = n.id; renderAll();
    $('title').focus();
  }

  function openNote(id) {
    currentId = id; renderAll();
    if (matchMedia('(min-width: 721px)').matches) {
      const n = get(id);
      if (n && !n.title && !n.body) $('title').focus();
    }
  }

  $('newBtn').onclick = createNote;
  searchEl.oninput = () => { query = searchEl.value; renderList(); };
  listEl.onclick = e => { const it = e.target.closest('.item'); if (it) openNote(it.dataset.id); };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); app.classList.remove('editing'); searchEl.focus(); }
  });

  // 첫 방문: 안내 메모 + 데스크톱에서는 첫 메모 자동 선택
  if (!notes.length && !localStorage.getItem(KEY + '-seen')) {
    notes.push({ id: uid(), title: '환영합니다 👋', body: '왼쪽 목록에서 메모를 고르거나 "＋ 새 메모"로 새로 쓰세요.\n\n• 입력하면 자동 저장됩니다\n• 위 검색창으로 제목과 본문을 검색\n• Ctrl+K 로 검색창으로 이동\n• 새로고침해도 이 브라우저에 남아 있어요', created: Date.now(), updated: Date.now() });
    save(); try { localStorage.setItem(KEY + '-seen', '1'); } catch (e) {}
  }
  if (matchMedia('(min-width: 721px)').matches && notes.length) currentId = [...notes].sort((a, b) => b.updated - a.updated)[0].id;
  renderAll();
})();
</script>
</body>
</html>
